name: Build DrakoCtrl WDA for TrollStore

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID for WDA'
        required: false
        default: 'com.facebook.WebDriverAgentRunner'
      display_name:
        description: 'App display name'
        required: false
        default: 'DrakoCtrl'
      ipa_filename:
        description: 'Output IPA filename (without .ipa)'
        required: false
        default: 'DrakoCtrl'
      auth_key:
        description: 'IPC Auth Key (leave empty to use repository secret IPC_AUTH_KEY)'
        required: false
        default: ''
      min_ios_version:
        description: 'Minimum iOS version'
        required: false
        default: '15.0'
      wda_version:
        # GHIM v11.4.0 — KHONG de trong.
        #
        # IPA dang chay tot duoc dung 2026-03-16, khi `wda_version` con de trong.
        # Hom do HEAD cua appium/WebDriverAgent la 28e2475356 = release 11.4.0.
        #
        # De trong BAY GIO se lay latest (>= v16.7.0), ma tu v16.7.0 appium da GO
        # vendored RoutingHTTPServer -> scripts/patch_auth.py khong tim thay
        # RoutingConnection.m -> build FAIL.
        #
        # Ghim v11.4.1 cung KHONG duoc: ban do doi vung screenshot/MJPEG
        # (them consecutiveScreenshotFailures) lam dieu khien kem muot.
        description: 'WDA version (tag/branch/SHA). GHIM v11.4.0 — de trong se FAIL, v11.4.1 kem muot.'
        required: false
        default: 'v11.4.0'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ════════════════════════════════════════════════════════
      # Bước 0: Clone WDA với version pinning
      # ════════════════════════════════════════════════════════
      - name: Clone WebDriverAgent source
        run: |
          git clone https://github.com/appium/WebDriverAgent.git
          cd WebDriverAgent

          WDA_VERSION="${{ github.event.inputs.wda_version }}"
          if [ -n "$WDA_VERSION" ]; then
            echo "📌 Checking out WDA version: $WDA_VERSION"
            git checkout "$WDA_VERSION"
          fi

          WDA_TAG=$(git describe --tags --always 2>/dev/null || echo "unknown")
          WDA_COMMIT=$(git rev-parse --short HEAD)
          echo "WDA version: $WDA_TAG (commit: $WDA_COMMIT)"
          echo "WDA_TAG=$WDA_TAG" >> $GITHUB_ENV
          echo "WDA_COMMIT=$WDA_COMMIT" >> $GITHUB_ENV

      - name: Setup Xcode 15 (lightweight build — no extra XCTest frameworks)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Verify Xcode version
        run: |
          echo "=== Xcode Version ==="
          xcodebuild -version
          echo "=== SDK Path ==="
          xcrun --show-sdk-path
          echo "=== Available Xcodes ==="
          ls /Applications/ | grep Xcode || true

      # ════════════════════════════════════════════════════════
      # Bước 1: Customize WDA (permissions, MinimumOSVersion...)
      # ════════════════════════════════════════════════════════
      - name: Customize WDA pre-build
        run: |
          export DISPLAY_NAME="${{ github.event.inputs.display_name }}"
          export BUNDLE_PREFIX="com.facebook"
          export MIN_IOS="${{ github.event.inputs.min_ios_version }}"
          bash scripts/customize_wda.sh

      # ════════════════════════════════════════════════════════
      # Bước 1.5: Add lệnh tuỳ biến của repo này
      #   FBPhotoCommands — /wda/importPhoto, /wda/importVideo
      #   FBPasteCommands — /wda/paste, /wda/setClipboard
      # ════════════════════════════════════════════════════════
      - name: Add custom commands to WDA
        run: |
          echo "=== Adding FBPhotoCommands + FBPasteCommands ==="
          COMMANDS_DIR="WebDriverAgent/WebDriverAgentLib/Commands"

          if [ ! -d "$COMMANDS_DIR" ]; then
            echo "ERROR: Commands dir not found!"
            find WebDriverAgent -name "FBCustomCommands.m" -type f
            exit 1
          fi

          # Copy source files
          for BASE in FBPhotoCommands FBPasteCommands; do
            cp "src/$BASE.h" "$COMMANDS_DIR/"
            cp "src/$BASE.m" "$COMMANDS_DIR/"
            echo "  Copied $BASE.h/.m → $COMMANDS_DIR/"
          done

          # Photos.framework duoc link trong scripts/add_to_xcode.rb (gem xcodeproj,
          # target WebDriverAgentLib tuong minh). Truoc day co scripts/link_photos_framework.py
          # lam bang regex tren project.pbxproj — da bo vi khong nham dung target.

          # Thêm vào Xcode project (compile sources)
          gem install xcodeproj 2>/dev/null || true
          ruby scripts/add_to_xcode.rb

          # Verify
          echo "=== Verify files ==="
          ls -la "$COMMANDS_DIR/FBPhotoCommands"* "$COMMANDS_DIR/FBPasteCommands"*
          echo "  ✅ Custom commands ready"

      # ════════════════════════════════════════════════════════
      # Bước 2: Setup auth config (validate key, set env vars)
      # ════════════════════════════════════════════════════════
      - name: Setup auth configuration
        env:
          INPUT_AUTH_KEY: ${{ github.event.inputs.auth_key }}
          SECRET_AUTH_KEY: ${{ secrets.IPC_AUTH_KEY }}
        run: |
          set -euo pipefail

          # Ưu tiên: input > secret
          AUTH_KEY="$INPUT_AUTH_KEY"
          if [ -z "$AUTH_KEY" ]; then
            AUTH_KEY="$SECRET_AUTH_KEY"
          fi

          if [ -z "$AUTH_KEY" ]; then
            echo "╔══════════════════════════════════════════════════════╗"
            echo "║  FATAL: Không có auth key!                          ║"
            echo "║  Kiểm tra: Settings → Secrets → Actions             ║"
            echo "║  Secret name: IPC_AUTH_KEY                           ║"
            echo "╚══════════════════════════════════════════════════════╝"
            exit 1
          fi

          if [ ${#AUTH_KEY} -lt 16 ]; then
            echo "FATAL: Auth key quá ngắn (${#AUTH_KEY} chars). Tối thiểu 16 chars!"
            exit 1
          fi

          ROUTE_PREFIX="ipc_${AUTH_KEY:0:8}"
          echo "Auth key: ${#AUTH_KEY} chars, prefix: $ROUTE_PREFIX"

          echo "AUTH_ENABLED=true" >> $GITHUB_ENV
          {
            echo "AUTH_KEY<<AUTHEOF"
            echo "$AUTH_KEY"
            echo "AUTHEOF"
          } >> $GITHUB_ENV
          echo "ROUTE_PREFIX=$ROUTE_PREFIX" >> $GITHUB_ENV

          # Patch auth trực tiếp vào source code RoutingConnection.m (Layer 1)
          # Đây là cách đáng tin cậy nhất — code chạy inline, không cần swizzle
          python3 scripts/patch_auth.py WebDriverAgent "$AUTH_KEY" "$ROUTE_PREFIX"
          echo "✅ Auth patched (Layer 1 — source injection)"

          # Verify patch applied correctly
          RC_FILE=$(find WebDriverAgent -name "RoutingConnection.m" -type f | head -1)
          echo "=== Patched file: $RC_FILE ==="
          echo "--- Auth guard code ---"
          grep -A 20 "IPC Route Guard" "$RC_FILE" || echo "WARNING: patch not found!"
          echo "--- End verify ---"

      # Layer 2 (IPCAuthGuard.m swizzle) đã bị loại bỏ:
      # - Swizzle runtime không đáng tin cậy (có thể không hook được)
      # - Xung đột với Layer 1 (double-strip prefix)
      # - Layer 1 source patch đảm bảo 100% chạy

      # ════════════════════════════════════════════════════════
      # Bước 4: Build
      # ════════════════════════════════════════════════════════
      - name: Build WebDriverAgent for iOS (arm64)
        run: |
          cd WebDriverAgent

          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="${{ github.event.inputs.bundle_id }}" \
            DEVELOPMENT_TEAM="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET="${{ github.event.inputs.min_ios_version }}"

          echo "=== Build completed ==="

      # ════════════════════════════════════════════════════════
      # Bước 5: Package TrollStore-compatible IPA
      # ════════════════════════════════════════════════════════
      - name: Package TrollStore-compatible IPA
        run: |
          set -euo pipefail

          BUNDLE_ID="${{ github.event.inputs.bundle_id }}"
          DISPLAY_NAME="${{ github.event.inputs.display_name }}"
          MIN_IOS="${{ github.event.inputs.min_ios_version }}"
          IPA_NAME="${{ github.event.inputs.ipa_filename }}"

          # ── Tìm .app đã build ──
          APP_PATH=$(find WebDriverAgent/build -name "WebDriverAgentRunner-Runner.app" -type d | head -1)
          echo "Found app at: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: WebDriverAgentRunner-Runner.app not found!"
            find WebDriverAgent/build -name "*.app" -type d
            exit 1
          fi

          # ── Tạo Payload ──
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          TARGET_APP="Payload/WebDriverAgentRunner-Runner.app"
          PLIST="$TARGET_APP/Info.plist"

          # ══════════════════════════════════════
          # Custom App Icon (resize, giữ gốc cho TrollStore)
          # ══════════════════════════════════════
          if [ -f "resources/icon.png" ]; then
            echo "=== Setting custom app icon ==="
            sips -z 120 120 resources/icon.png --out "$TARGET_APP/AppIcon60x60@2x.png" 2>/dev/null || true
            sips -z 180 180 resources/icon.png --out "$TARGET_APP/AppIcon60x60@3x.png" 2>/dev/null || true
            sips -z 152 152 resources/icon.png --out "$TARGET_APP/AppIcon76x76@2x.png" 2>/dev/null || true
            sips -z 167 167 resources/icon.png --out "$TARGET_APP/AppIcon83.5x83.5@2x.png" 2>/dev/null || true
            cp resources/icon.png "$TARGET_APP/icon.png"

            /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:1 string AppIcon76x76" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:2 string AppIcon83.5x83.5" "$PLIST"
            echo "  ✅ App icon set"
          fi

          # ══════════════════════════════════════
          # Patch Info.plist — Bundle ID + Display Name
          # ══════════════════════════════════════
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName '$DISPLAY_NAME'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string '$DISPLAY_NAME'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier '${BUNDLE_ID}.xctrunner'" "$PLIST"

          XCTEST_DIR=$(find "$TARGET_APP/PlugIns" -name "*.xctest" -type d | head -1)
          if [ -n "$XCTEST_DIR" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier '$BUNDLE_ID'" "$XCTEST_DIR/Info.plist" 2>/dev/null || true
          fi

          # ══════════════════════════════════════
          # TrollStore self-launch config
          # ══════════════════════════════════════
          echo "=== Configuring for TrollStore ==="

          # MinimumOSVersion
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion '$MIN_IOS'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string '$MIN_IOS'" "$PLIST"

          # Self-launch
          /usr/libexec/PlistBuddy -c "Set :SBIsLaunchableDuringSetup true" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :SBIsLaunchableDuringSetup bool true" "$PLIST"

          /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST"

          # Background mode
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string continuous" "$PLIST"

          # UILaunchScreen (iOS 14+)
          /usr/libexec/PlistBuddy -c "Delete :UILaunchScreen" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$PLIST"

          # iPhone + iPad
          /usr/libexec/PlistBuddy -c "Delete :UIDeviceFamily" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:1 integer 2" "$PLIST"

          # HTTP cho local network
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"

          # Bonjour services (iOS 14+ local network)
          /usr/libexec/PlistBuddy -c "Delete :NSBonjourServices" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string _http._tcp" "$PLIST"

          # Essential permissions
          PERM_TEXT="Required for device automation"
          /usr/libexec/PlistBuddy -c "Set :NSLocalNetworkUsageDescription '$PERM_TEXT'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string '$PERM_TEXT'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription '$PERM_TEXT'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string '$PERM_TEXT'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription '$PERM_TEXT'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string '$PERM_TEXT'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription '$PERM_TEXT'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string '$PERM_TEXT'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription '$PERM_TEXT'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string '$PERM_TEXT'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription '$PERM_TEXT'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string '$PERM_TEXT'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysAndWhenInUseUsageDescription '$PERM_TEXT'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string '$PERM_TEXT'" "$PLIST"

          echo "  ✅ TrollStore config applied (MinOS=$MIN_IOS)"

          # ══════════════════════════════════════
          # Xóa permissions thừa từ WDA mặc định (post-build)
          # WDA gốc có ~24 permissions, chỉ giữ 6 cái thiết yếu
          # ══════════════════════════════════════
          echo "=== Cleaning unnecessary permissions ==="
          removed=0
          for perm in \
            NFCReaderUsageDescription \
            NSAppleMusicUsageDescription \
            NSBluetoothAlwaysUsageDescription \
            NSBluetoothPeripheralUsageDescription \
            NSCalendarsUsageDescription \
            NSContactsUsageDescription \
            NSFaceIDUsageDescription \
            NSHealthClinicalHealthRecordsShareUsageDescription \
            NSHealthShareUsageDescription \
            NSHealthUpdateUsageDescription \
            NSHomeKitUsageDescription \
            NSLocationDefaultAccuracyReduced \
            NSMotionUsageDescription \
            NSRemindersUsageDescription \
            NSSensorKitPrivacyPolicyURL \
            NSSensorKitUsageDescription \
            NSSensorKitUsageDetail \
            NSSiriUsageDescription \
            NSSpeechRecognitionUsageDescription \
            NSUserTrackingUsageDescription \
            NSVideoSubscriberAccountUsageDescription; do
            if /usr/libexec/PlistBuddy -c "Delete :$perm" "$PLIST" 2>/dev/null; then
              ((removed++)) || true
            fi
          done
          echo "  ✅ Removed $removed unnecessary permissions (keeping 6 essential)"

          # ══════════════════════════════════════
          # Dọn dẹp signatures cũ
          # ══════════════════════════════════════
          find Payload -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          find Payload -name "embedded.mobileprovision" -delete 2>/dev/null || true
          find Payload -name "*.dSYM" -type d -exec rm -rf {} + 2>/dev/null || true

          # ══════════════════════════════════════
          # Remove extra XCTest frameworks bundled by Xcode 16
          # iOS 15.x đã có sẵn trên hệ thống — chỉ cần libXCTestSwiftSupport.dylib
          # Xcode 16 bundle 7 frameworks (~4.4MB) vs Xcode 15 chỉ 1 (~878KB)
          # ══════════════════════════════════════
          echo "=== Removing unnecessary Xcode 16 frameworks ==="
          FRAMEWORKS_DIR="Payload/WebDriverAgentRunner-Runner.app/Frameworks"
          REMOVED=0
          for fw in XCTAutomationSupport XCTest XCTestCore XCTestSupport XCUIAutomation XCUnit; do
            FW_PATH="$FRAMEWORKS_DIR/${fw}.framework"
            if [ -d "$FW_PATH" ]; then
              SIZE=$(du -sk "$FW_PATH" | cut -f1)
              echo "  Removing ${fw}.framework (${SIZE}KB)"
              rm -rf "$FW_PATH"
              REMOVED=$((REMOVED + 1))
            fi
          done
          echo "  ✅ Removed $REMOVED extra frameworks"

          # Replace libXCTestSwiftSupport.dylib with lightweight version
          echo "=== Replacing libXCTestSwiftSupport.dylib ==="
          XCTEST_DYLIB="$FRAMEWORKS_DIR/libXCTestSwiftSupport.dylib"
          if [ -f "resources/libXCTestSwiftSupport.dylib" ] && [ -f "$XCTEST_DYLIB" ]; then
            BEFORE=$(stat -f%z "$XCTEST_DYLIB")
            cp resources/libXCTestSwiftSupport.dylib "$XCTEST_DYLIB"
            AFTER=$(stat -f%z "$XCTEST_DYLIB")
            echo "  ${BEFORE} → ${AFTER} bytes (saved $(( (BEFORE - AFTER) / 1024 ))KB)"
          fi

          # Strip arm64e slices from remaining FAT binaries
          echo "=== Stripping arm64e slices ==="
          find Payload -type f | while read f; do
            if file "$f" | grep -q "universal binary"; then
              ARCHS=$(lipo -info "$f" 2>/dev/null | sed 's/.*: //')
              if echo "$ARCHS" | grep -q "arm64e"; then
                BEFORE=$(stat -f%z "$f")
                lipo -thin arm64 "$f" -output "${f}.thin" 2>/dev/null && mv "${f}.thin" "$f"
                AFTER=$(stat -f%z "$f")
                echo "  $(basename "$f"): ${BEFORE} → ${AFTER} (saved $(( (BEFORE - AFTER) / 1024 ))KB)"
              fi
            fi
          done
          echo "  ✅ Optimization complete"

          # ══════════════════════════════════════
          # Patch MH_BUNDLE → MH_DYLIB (Frameworks ONLY)
          # QUAN TRỌNG: Hỗ trợ cả FAT binary (universal)
          # KHÔNG patch PlugIns/*.xctest (NSBundle cần MH_BUNDLE)
          # ══════════════════════════════════════
          echo "=== Patching Mach-O binaries (Frameworks only) ==="
          python3 << 'PYEOF'
          import struct, os

          def patch_bundle_to_dylib(filepath):
              with open(filepath, 'rb') as f:
                  data = bytearray(f.read())

              magic = struct.unpack_from('<I', data, 0)[0]
              patched = False
              fname = os.path.basename(filepath)

              # Thin binary (64-bit hoặc 32-bit)
              if magic in (0xfeedfacf, 0xfeedface):
                  ft = struct.unpack_from('<I', data, 12)[0]
                  if ft == 8:  # MH_BUNDLE
                      struct.pack_into('<I', data, 12, 6)  # → MH_DYLIB
                      patched = True
                      print(f"  [{fname}] PATCHED: MH_BUNDLE -> MH_DYLIB")

              # FAT binary (universal) — patch từng slice
              elif magic in (0xbebafeca, 0xcafebabe):
                  nfat = struct.unpack_from('>I', data, 4)[0]
                  for i in range(nfat):
                      entry_offset = 8 + i * 20
                      slice_offset = struct.unpack_from('>I', data, entry_offset + 8)[0]
                      slice_magic = struct.unpack_from('<I', data, slice_offset)[0]
                      if slice_magic in (0xfeedfacf, 0xfeedface):
                          ft = struct.unpack_from('<I', data, slice_offset + 12)[0]
                          if ft == 8:  # MH_BUNDLE
                              struct.pack_into('<I', data, slice_offset + 12, 6)
                              patched = True
                              print(f"  [{fname}] Slice {i} PATCHED: MH_BUNDLE -> MH_DYLIB")

              if patched:
                  with open(filepath, 'wb') as f:
                      f.write(data)
              return patched

          # CHỈ patch trong Frameworks/ — KHÔNG patch PlugIns/xctest
          total_patched = 0
          for root, dirs, files in os.walk("Payload"):
              for fname in files:
                  fpath = os.path.join(root, fname)
                  if "/Frameworks/" not in fpath.replace("\\", "/"):
                      continue
                  try:
                      with open(fpath, 'rb') as f:
                          magic_bytes = f.read(4)
                      if len(magic_bytes) < 4:
                          continue
                      magic = struct.unpack_from('<I', magic_bytes, 0)[0]
                      if magic in (0xfeedfacf, 0xfeedface, 0xbebafeca, 0xcafebabe):
                          if patch_bundle_to_dylib(fpath):
                              total_patched += 1
                  except:
                      pass

          print(f"\nTotal binaries patched: {total_patched}")
          PYEOF

          # ══════════════════════════════════════
          # Fakesign với ldid + TrollStore entitlements
          # ══════════════════════════════════════
          echo "=== Installing ldid ==="
          brew install ldid 2>/dev/null || true

          echo "=== Fakesigning binaries with TrollStore entitlements ==="
          ENTITLEMENTS="resources/entitlements.plist"
          if [ ! -f "$ENTITLEMENTS" ]; then
            echo "WARNING: entitlements.plist not found, using empty signature"
            ENTITLEMENTS=""
          fi

          SIGN_COUNT=0
          SIGN_FAIL=0
          find Payload -type f | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              echo "  Signing: $(basename "$f")"
              if [ -n "$ENTITLEMENTS" ]; then
                ldid -S"$ENTITLEMENTS" "$f" 2>/dev/null || {
                  echo "  WARNING: ldid failed on $(basename "$f"), trying without entitlements..."
                  ldid -S "$f" 2>/dev/null || echo "  WARNING: ldid completely failed on $(basename "$f")"
                }
              else
                ldid -S "$f" 2>/dev/null || echo "  WARNING: ldid failed on $(basename "$f")"
              fi
            fi
          done
          echo "  ✅ Signing complete"

          # ══════════════════════════════════════
          # Auth status log
          # ══════════════════════════════════════
          if [ "$AUTH_ENABLED" = "true" ]; then
            echo ""
            echo "🔐 Auth: ENABLED"
            echo "  Layer 1: patch_auth.py (source injection into RoutingConnection.m)"
          else
            echo ""
            echo "⚠️ Auth: DISABLED (no auth key provided)"
          fi

          # ══════════════════════════════════════
          # Tạo IPA
          # ══════════════════════════════════════
          zip -r "${IPA_NAME}.ipa" Payload/
          echo ""
          echo "=== ✅ IPA created ==="
          ls -lh "${IPA_NAME}.ipa"

          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV

      # ════════════════════════════════════════════════════════
      # Bước 6: Verify IPA
      # ════════════════════════════════════════════════════════
      - name: Verify IPA
        # Moi gia tri ${{ }} di qua khoi env: nay, KHONG noi suy thang vao shell.
        # Ly do: ${{ }} duoc thay TRUOC khi shell chay, nen input cua nguoi dung
        # (display_name, ipa_filename...) co the chen lenh. Qua env: thi chung chi
        # la du lieu. Cac bien AUTH_ENABLED / ROUTE_PREFIX / WDA_TAG / WDA_COMMIT
        # da la bien moi truong that (buoc truoc ghi vao $GITHUB_ENV) nen dung thang.
        env:
          IPA_NAME: ${{ github.event.inputs.ipa_filename }}
          WANT_NAME: ${{ github.event.inputs.display_name }}
          WANT_BUNDLE: ${{ github.event.inputs.bundle_id }}
          WANT_VER: ${{ github.event.inputs.wda_version }}
          MIN_IOS: ${{ github.event.inputs.min_ios_version }}
        run: |
          IPA="${IPA_NAME}.ipa"
          echo "=== Verifying ${IPA} ==="
          echo ""

          # Kiem HET moi muc roi moi thoat, de mot lan chay chi ra duoc TAT CA cho hong.
          FAIL=0
          ok()  { echo "  OK    $1"; }
          bad() { echo "  FAIL  $1"; FAIL=1; }
          has() { LC_ALL=C grep -qa -- "$2" "$1" 2>/dev/null; }

          # ─── 1. Vo ngoai ───
          IPA_SIZE=$(stat -f%z "$IPA" 2>/dev/null || stat --format=%s "$IPA")
          IPA_SIZE_MB=$(echo "scale=1; $IPA_SIZE / 1048576" | bc)
          if [ "$IPA_SIZE" -ge 1000000 ]; then ok "Kich thuoc ${IPA_SIZE_MB} MB"
          else bad "IPA qua nho ($IPA_SIZE bytes)"; fi
          if unzip -t "$IPA" >/dev/null 2>&1; then ok "Zip nguyen ven"
          else bad "Zip bi hong"; fi

          # ─── 2. Giai nen de soi RUOT, khong chi soi vo ───
          rm -rf _verify && mkdir -p _verify
          unzip -q "$IPA" -d _verify || { echo "FATAL: khong giai nen duoc"; exit 1; }
          APP="_verify/Payload/WebDriverAgentRunner-Runner.app"
          LIB="$APP/PlugIns/WebDriverAgentRunner.xctest/Frameworks/WebDriverAgentLib.framework/WebDriverAgentLib"

          if [ -f "$APP/WebDriverAgentRunner-Runner" ]; then ok "Co binary chinh"
          else bad "Thieu binary chinh"; fi
          if [ ! -f "$LIB" ]; then
            bad "Thieu WebDriverAgentLib — khong the kiem tiep"
            exit 1
          fi
          ok "Co WebDriverAgentLib"

          # ─── 3. Info.plist ───
          PL="$APP/Info.plist"
          plget() { plutil -extract "$1" raw -o - "$PL" 2>/dev/null || echo ""; }

          GOT_NAME="$(plget CFBundleDisplayName)"
          if [ "$GOT_NAME" = "$WANT_NAME" ]; then ok "Ten hien thi = $GOT_NAME"
          else bad "Ten hien thi = '$GOT_NAME', mong doi '$WANT_NAME'"; fi

          WANT_ID="${WANT_BUNDLE}.xctrunner"
          GOT_ID="$(plget CFBundleIdentifier)"
          if [ "$GOT_ID" = "$WANT_ID" ]; then ok "Bundle ID = $GOT_ID"
          else bad "Bundle ID = '$GOT_ID', mong doi '$WANT_ID'"; fi

          # Quyen GHI vao thu vien anh. Thieu no thi nhap anh/video hong tren may that,
          # ma IPA van chay va van dieu khien duoc -> rat de lot neu khong kiem o day.
          if [ -n "$(plget NSPhotoLibraryAddUsageDescription)" ]; then
            ok "Co NSPhotoLibraryAddUsageDescription"
          else
            bad "THIEU NSPhotoLibraryAddUsageDescription — nhap anh/video se hong"
          fi

          # ─── 4. Ma tuy bien cua repo NAY (khong co trong appium goc) ───
          # 2026-08-25: mot ban IPA build tu nham repo builder da di qua buoc verify cu
          # va ra mau xanh, du thieu ca hai route duoi day. Do la ly do co muc kiem nay.
          for R in importPhoto importVideo paste setClipboard; do
            if has "$LIB" "/wda/$R"; then ok "Co route /wda/$R"
            else bad "THIEU route /wda/$R — build tu nham nguon?"; fi
          done

          # Photos.framework phai duoc LINK that, khong chi co ma nguon goi toi no
          if otool -L "$LIB" 2>/dev/null | grep -q "Photos.framework"; then
            ok "Da link Photos.framework"
          else
            bad "CHUA link Photos.framework — add_to_xcode.rb khong link duoc vao WebDriverAgentLib?"
          fi

          # ─── 5. Auth (Layer 1 — source patch vao RoutingConnection.m) ───
          # ROUTE_PREFIX khong phai bi mat: no nam san trong IPA phat hanh.
          if [ "$AUTH_ENABLED" = "true" ]; then
            if has "$LIB" "X-IPC-Auth"; then ok "Co header X-IPC-Auth"
            else bad "THIEU X-IPC-Auth — patch_auth.py khong an vao binary"; fi
            if [ -z "$ROUTE_PREFIX" ]; then
              bad "ROUTE_PREFIX rong — buoc auth khong truyen duoc bien sang day"
            elif has "$LIB" "$ROUTE_PREFIX"; then ok "Co route prefix $ROUTE_PREFIX"
            else bad "THIEU route prefix $ROUTE_PREFIX"; fi
          else
            bad "AUTH_ENABLED != true (='$AUTH_ENABLED') — IPA khong co auth"
          fi

          # ─── 6. Dung phien ban WDA da yeu cau ───
          if [ -z "$WANT_VER" ]; then
            bad "wda_version de trong — phai ghim (xem chu thich dau file)"
          elif [ -z "$WDA_TAG" ]; then
            bad "WDA_TAG rong — buoc clone khong truyen duoc bien sang day"
          elif [ "$WDA_TAG" = "$WANT_VER" ]; then
            ok "WDA = $WDA_TAG (dung ban da ghim)"
          else
            bad "WDA = '$WDA_TAG' nhung yeu cau '$WANT_VER'"
          fi

          # Dau hieu cua WDA >= v11.4.1 trong vung screenshot/MJPEG.
          if has "$LIB" "consecutiveScreenshotFailures"; then
            echo "  CANH BAO  Thay 'consecutiveScreenshotFailures' — ma cua WDA >= v11.4.1."
            echo "            Ban do da duoc kiem chung la lam dieu khien KEM MUOT."
            echo "            Ban chay tot la v11.4.0."
          else
            ok "Khong co ma screenshot cua v11.4.1"
          fi

          rm -rf _verify

          echo ""
          echo "=============== BUILD SUMMARY ==============="
          echo "  IPA          : $IPA (${IPA_SIZE_MB} MB)"
          echo "  Display Name : $GOT_NAME"
          echo "  Bundle ID    : $GOT_ID"
          echo "  Min iOS      : $MIN_IOS"
          echo "  WDA          : $WDA_TAG ($WDA_COMMIT)"
          echo "  Auth         : $AUTH_ENABLED"
          echo "============================================="

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "VERIFY THAT BAI — DUNG dung IPA nay. Xem cac dong FAIL o tren."
            exit 1
          fi
          echo ""
          echo "Verify dat toan bo."

      # ════════════════════════════════════════════════════════
      # Upload artifact
      # ════════════════════════════════════════════════════════
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.ipa_filename }}-IPA
          path: ${{ github.event.inputs.ipa_filename }}.ipa
          retention-days: 90
